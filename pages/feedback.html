<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Feedback | ViewIT</title>

    <!-- Tailwind -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body
    class="font-[Ubuntu] bg-gradient-to-t from-neutral-600 to-zinc-900 min-h-screen text-white"
  >
    <!-- NAVBAR -->
    <div id="navbar"></div>

    <!-- HERO -->
    <section class="flex items-center justify-center text-center py-24 px-6">
      <div class="max-w-2xl">
        <h1 class="text-4xl md:text-5xl font-bold mb-4">Feedback</h1>
        <p class="text-gray-300 text-lg">
          Tell us what you think about ViewIT.
        </p>
      </div>
    </section>

    <!-- FEEDBACK FORM -->
    <section class="max-w-3xl mx-auto px-6 pb-24">
      <form
        id="feedbackForm"
        class="bg-gray-900/80 backdrop-blur-xl rounded-2xl shadow-2xl p-8 space-y-6"
      >
        <div>
          <label class="block text-sm mb-1">Your Name</label>
          <input
            type="text"
            placeholder="Enter your name"
            required
            class="w-full px-4 py-3 rounded-lg bg-gray-800 focus:outline-none focus:ring-2 focus:ring-indigo-500"
          />
        </div>

        <div>
          <label class="block text-sm mb-1">Email Address</label>
          <input
            type="email"
            placeholder="Enter your email"
            required
            class="w-full px-4 py-3 rounded-lg bg-gray-800 focus:outline-none focus:ring-2 focus:ring-indigo-500"
          />
        </div>

        <div>
          <label class="block text-sm mb-1">Your Feedback</label>
          <textarea
            rows="5"
            placeholder="Write your feedback here..."
            required
            class="w-full px-4 py-3 rounded-lg bg-gray-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-none"
          ></textarea>
        </div>

        <button
          type="submit"
          class="w-full bg-indigo-600 hover:bg-indigo-500 py-3 rounded-lg font-medium transition"
        >
          Submit Feedback
        </button>
      </form>
    </section>

    <!-- FOOTER NOTE -->
    <footer class="text-center text-gray-400 text-sm py-6">
      This product uses the TMDB API but is not endorsed or certified by TMDB.
    </footer>

    <!-- NAVBAR LOADER -->
    <script>
      fetch("../components/navbar.html")
        .then((res) => res.text())
        .then((data) => {
          document.getElementById("navbar").innerHTML = data;
        });
    </script>

    <!-- FEEDBACK LOGIC -->
    <script>
      const feedbackForm = document.getElementById("feedbackForm");

      feedbackForm.addEventListener("submit", function (e) {
        e.preventDefault();
        alert("Thank you for your feedback! We appreciate it.");
        feedbackForm.reset();
        window.location.href = "../index.html";
      });
    </script>
  </body>
</html>
