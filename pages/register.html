<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | ViewIT</title>

    <link rel="stylesheet" href="/css/global.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body class="relative font-[Ubuntu] min-h-screen text-white bg-black">
    <!-- PREMIUM BACKGROUND -->
    <div class="fixed inset-0 -z-10">
      <div
        class="absolute inset-0 bg-gradient-to-br from-black via-zinc-900 to-black"
      ></div>
      <div
        class="absolute -top-64 -left-64 w-[800px] h-[800px] bg-[radial-gradient(circle,rgba(255,255,255,0.08),transparent_70%)] blur-3xl"
      ></div>
      <div
        class="absolute -bottom-64 -right-64 w-[800px] h-[800px] bg-[radial-gradient(circle,rgba(255,255,255,0.06),transparent_70%)] blur-3xl"
      ></div>
    </div>

    <div id="navbar"></div>

    <section class="flex items-center justify-center py-20 px-6">
      <form
        id="registerForm"
        class="relative w-full max-w-md p-10 rounded-3xl bg-white/5 backdrop-blur-2xl border border-white/10 shadow-[0_0_60px_rgba(255,255,255,0.05)]"
        novalidate
      >
        <h1 class="text-4xl font-bold text-center mb-2">Create Account</h1>
        <p class="text-slate-400 text-center mb-8">Join ViewIT</p>

        <!-- Email -->
        <div class="mb-6">
          <label class="block text-sm mb-2 text-slate-300">Email</label>
          <input
            type="email"
            id="email"
            required
            class="w-full px-4 py-3 rounded-xl bg-black/60 border border-white/10 focus:outline-none focus:ring-2 focus:ring-white/30 transition"
          />
        </div>

        <!-- Password -->
        <div class="mb-4 relative">
          <label class="block text-sm mb-2 text-slate-300">Password</label>

          <input
            type="password"
            id="password"
            required
            class="w-full px-4 py-3 pr-12 rounded-xl bg-black/60 border border-white/10 focus:outline-none focus:ring-2 focus:ring-white/30 transition"
          />

          <button
            type="button"
            id="togglePassword"
            class="absolute right-4 top-[42px] text-slate-400 hover:text-white text-sm"
          >
            Show
          </button>
        </div>

        <!-- Strength Bar -->
        <div class="mb-4">
          <div class="h-2 w-full bg-white/10 rounded-full overflow-hidden">
            <div
              id="strengthBar"
              class="h-full w-0 transition-all duration-300 rounded-full"
            ></div>
          </div>
          <p id="strengthText" class="text-xs mt-2 text-slate-400"></p>
        </div>

        <!-- Confirm Password -->
        <div class="mb-4 relative">
          <label class="block text-sm mb-2 text-slate-300">
            Confirm Password
          </label>

          <input
            type="password"
            id="confirm_password"
            required
            class="w-full px-4 py-3 pr-12 rounded-xl bg-black/60 border border-white/10 focus:outline-none focus:ring-2 focus:ring-white/30 transition"
          />

          <button
            type="button"
            id="toggleConfirm"
            class="absolute right-4 top-[42px] text-slate-400 hover:text-white text-sm"
          >
            Show
          </button>
        </div>

        <p id="matchText" class="text-xs mb-6"></p>

        <!-- Submit -->
        <button
          type="submit"
          id="submitBtn"
          disabled
          class="w-full py-3 rounded-xl font-semibold bg-gradient-to-r from-white via-slate-200 to-white text-black opacity-40 cursor-not-allowed transition-all duration-300"
        >
          Sign Up
        </button>

        <div class="text-center text-sm text-slate-400 mt-8">
          Already have an account?
          <a href="login.html" class="hover:text-white underline">Login</a>
        </div>
      </form>
    </section>

    <footer
      class="text-center text-slate-500 text-sm py-6 border-t border-white/5"
    >
      This product uses the TMDB API but is not endorsed or certified by TMDB.
    </footer>

    <script>
      fetch("../components/navbar.html")
        .then((res) => res.text())
        .then((data) => {
          document.getElementById("navbar").innerHTML = data;
        });
    </script>

    <script>
      const passwordInput = document.getElementById("password");
      const confirmInput = document.getElementById("confirm_password");
      const strengthBar = document.getElementById("strengthBar");
      const strengthText = document.getElementById("strengthText");
      const matchText = document.getElementById("matchText");
      const submitBtn = document.getElementById("submitBtn");
      const emailInput = document.getElementById("email");

      let passwordStrong = false;
      let passwordsMatch = false;

      // Password Strength
      passwordInput.addEventListener("input", () => {
        const value = passwordInput.value.trim();
        let strength = 0;

        if (value.length >= 8) strength++;
        if (/[A-Z]/.test(value)) strength++;
        if (/[0-9]/.test(value)) strength++;
        if (/[^A-Za-z0-9]/.test(value)) strength++;

        const levels = [
          { width: "25%", color: "bg-red-500", text: "Weak" },
          { width: "50%", color: "bg-orange-500", text: "Fair" },
          { width: "75%", color: "bg-yellow-400", text: "Good" },
          { width: "100%", color: "bg-green-500", text: "Strong" },
        ];

        if (value.length === 0) {
          strengthBar.style.width = "0";
          strengthText.textContent = "";
          passwordStrong = false;
        } else {
          const level = levels[Math.max(strength - 1, 0)];
          strengthBar.className = `h-full transition-all duration-300 ${level.color}`;
          strengthBar.style.width = level.width;
          strengthText.textContent = level.text;
          passwordStrong = strength >= 3;
        }

        checkMatch();
        checkForm();
      });

      function checkMatch() {
        const password = passwordInput.value.trim();
        const confirm = confirmInput.value.trim();

        if (!confirm) {
          matchText.textContent = "";
          passwordsMatch = false;
        } else if (password === confirm) {
          matchText.textContent = "✔ Passwords match";
          matchText.className = "text-xs text-green-400 mb-6";
          passwordsMatch = true;
        } else {
          matchText.textContent = "✖ Passwords do not match";
          matchText.className = "text-xs text-red-400 mb-6";
          passwordsMatch = false;
        }
      }

      confirmInput.addEventListener("input", () => {
        checkMatch();
        checkForm();
      });

      function checkForm() {
        if (passwordStrong && passwordsMatch && emailInput.value.trim()) {
          submitBtn.disabled = false;
          submitBtn.classList.remove("opacity-40", "cursor-not-allowed");
        } else {
          submitBtn.disabled = true;
          submitBtn.classList.add("opacity-40", "cursor-not-allowed");
        }
      }

      function setupToggle(btnId, inputId) {
        const btn = document.getElementById(btnId);
        const input = document.getElementById(inputId);

        btn.addEventListener("click", () => {
          if (input.type === "password") {
            input.type = "text";
            btn.textContent = "Hide";
          } else {
            input.type = "password";
            btn.textContent = "Show";
          }
        });
      }

      setupToggle("togglePassword", "password");
      setupToggle("toggleConfirm", "confirm_password");

      document
        .getElementById("registerForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          if (!passwordStrong || !passwordsMatch) return;

          alert("Account created successfully (demo)");
          window.location.href = "login.html";
        });
    </script>
  </body>
</html>
