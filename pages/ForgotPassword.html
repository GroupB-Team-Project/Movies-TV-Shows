<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password | ViewIT</title>

    <link rel="stylesheet" href="/css/global.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body
    class="relative font-[Ubuntu] min-h-screen text-white overflow-hidden bg-black"
  >
    <!-- BACKGROUND -->
    <div class="fixed inset-0 -z-10 overflow-hidden">
      <div
        class="absolute inset-0 bg-gradient-to-br from-black via-zinc-900 to-black"
      ></div>
      <div
        class="absolute -top-64 -left-64 w-[800px] h-[800px] bg-[radial-gradient(circle,rgba(255,255,255,0.08),transparent_70%)] blur-3xl"
      ></div>
      <div
        class="absolute -bottom-64 -right-64 w-[800px] h-[800px] bg-[radial-gradient(circle,rgba(255,255,255,0.06),transparent_70%)] blur-3xl"
      ></div>
      <div
        class="absolute inset-0 bg-[radial-gradient(circle_at_center,rgba(255,255,255,0.05),transparent_70%)]"
      ></div>
    </div>

    <!-- NAVBAR -->
    <div id="navbar"></div>
    <!-- PAGE -->
    <section
      class="flex items-center justify-center min-h-[calc(100vh-4rem)] px-6"
    >
      <!-- FORM CONTAINER -->
      <form
        id="resetForm"
        class="relative w-full max-w-md p-10 rounded-3xl bg-white/5 backdrop-blur-2xl border border-white/10 shadow-[0_0_60px_rgba(255,255,255,0.05)]"
      >
        <div
          class="absolute inset-0 rounded-3xl border border-white/5 pointer-events-none"
        ></div>

        <h1 class="text-4xl font-bold text-center mb-2 tracking-wide">
          Forgot Password
        </h1>
        <p class="text-slate-400 text-center mb-8">Step 1: Enter your email</p>

        <!-- Step 1: EMAIL -->
        <div id="emailInput">
          <label class="block text-sm mb-2 text-slate-300">Email Address</label>
          <input
            type="email"
            id="email"
            required
            placeholder="Enter Your Email"
            class="w-full px-4 py-3 rounded-xl bg-black/60 border border-white/10 focus:outline-none focus:ring-2 focus:ring-white/30 transition"
          />
          <button
            type="button"
            id="nextBtn"
            class="mt-6 w-full py-3 rounded-xl font-semibold bg-gradient-to-r from-white via-slate-200 to-white text-black hover:scale-[1.02] transition-all duration-300 shadow-[0_10px_30px_rgba(255,255,255,0.15)]"
          >
            Next
          </button>
        </div>

        <!-- Step 2: Reset Password -->
        <div id="passwordInput" class="hidden">
          <p class="text-slate-400 text-center mb-6">
            Step 2: Enter your new password
          </p>

          <label class="block text-sm mb-2 text-slate-300">New Password</label>
          <input
            type="password"
            id="newPassword"
            placeholder="Enter Your New Password"
            class="w-full px-4 py-3 mb-4 rounded-xl bg-black/60 border border-white/10 focus:outline-none focus:ring-2 focus:ring-white/30 transition"
          />

          <label class="block text-sm mb-2 text-slate-300"
            >Confirm Password</label
          >
          <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm Your Password"
            class="w-full px-4 py-3 mb-4 rounded-xl bg-black/60 border border-white/10 focus:outline-none focus:ring-2 focus:ring-white/30 transition"
          />

          <p id="passwordmatch" class="text-xs text-red-400 mb-4"></p>
          <!-- RESET BUTTON -->
          <button
            type="submit"
            id="resetBtn"
            class="w-full py-3 rounded-xl font-semibold bg-gradient-to-r from-white via-slate-200 to-white text-black opacity-40 cursor-not-allowed transition-all duration-300 shadow-[0_10px_30px_rgba(255,255,255,0.15)]"
            disabled
          >
            Reset Password
          </button>
        </div>
        <!-- LINK TO LOGIN PAGE-->
        <div class="text-center text-sm text-slate-400 mt-8">
          <a href="login.html" class="hover:text-white transition"
            >Back to Login Page</a
          >
        </div>
      </form>
    </section>

    <!-- FOOTER -->
    <footer
      class="text-center text-slate-500 text-sm py-6 border-t border-white/5"
    >
      This product uses the TMDB API but is not endorsed or certified by TMDB.
    </footer>

    <!-- NAVBAR -->
    <script>
      fetch("../components/navbar.html")
        .then((res) => res.text())
        .then((data) => (document.getElementById("navbar").innerHTML = data));
    </script>

    <script src="/js/forgotPassword.js" type="module"></script>
  </body>
</html>
