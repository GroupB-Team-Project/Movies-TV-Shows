<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | ViewIT</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { darkMode: "class" };
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />

    <style>
      body { font-family: 'Ubuntu', sans-serif; }
    </style>

    <!-- Apply saved theme immediately -->
    <script>
      const html = document.documentElement;
      const savedTheme = localStorage.getItem("theme");
      if (savedTheme === "dark") html.classList.add("dark");
      else if (savedTheme === "light") html.classList.remove("dark");
      else if (window.matchMedia("(prefers-color-scheme: dark)").matches)
        html.classList.add("dark");
    </script>
  </head>

  <body class="relative min-h-screen overflow-hidden transition-colors duration-300 bg-white dark:bg-black text-slate-900 dark:text-white">
    <!-- Background -->
    <div class="fixed inset-0 -z-10 overflow-hidden">
      <div class="absolute inset-0 bg-gradient-to-br from-white/5 via-zinc-100 to-white/10 dark:from-black dark:via-zinc-900 dark:to-black"></div>
      <div class="absolute -top-64 -left-64 w-[800px] h-[800px] bg-[radial-gradient(circle,rgba(0,0,0,0.02),transparent_70%)] dark:bg-[radial-gradient(circle,rgba(255,255,255,0.06),transparent_70%)] blur-3xl"></div>
      <div class="absolute -bottom-64 -right-64 w-[800px] h-[800px] bg-[radial-gradient(circle,rgba(0,0,0,0.02),transparent_70%)] dark:bg-[radial-gradient(circle,rgba(255,255,255,0.05),transparent_70%)] blur-3xl"></div>
      <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,rgba(0,0,0,0.01),transparent_70%)] dark:bg-[radial-gradient(circle_at_center,rgba(255,255,255,0.05),transparent_70%)]"></div>
    </div>

    <!-- Navbar -->
    <div id="navbar"></div>

    <!-- Login Section -->
    <section class="flex items-center justify-center min-h-[calc(100vh-4rem)] px-6">
      <form id="loginForm" novalidate
        class="relative w-full max-w-md p-10 rounded-3xl transition-colors duration-300
        bg-white/70 dark:bg-black/70 backdrop-blur-2xl border border-black/10 dark:border-white/10
        shadow-[0_5px_20px_rgba(0,0,0,0.1)] dark:shadow-[0_10px_30px_rgba(255,255,255,0.05)]">

        <div class="absolute inset-0 rounded-3xl border border-black/5 dark:border-white/5 pointer-events-none"></div>

        <h1 class="text-4xl font-bold text-center mb-2 transition-colors duration-300">Welcome Back</h1>
        <p class="text-slate-600 dark:text-slate-400 text-center mb-8 transition-colors duration-300">
          Sign in to continue to ViewIT
        </p>

        <!-- Email -->
        <div class="mb-6">
          <label for="email" class="block text-sm mb-2 text-slate-700 dark:text-slate-300 transition-colors duration-300">
            Email Address
          </label>
          <input type="email" id="email" name="email" placeholder="Enter your email" required
            class="w-full px-4 py-3 rounded-xl border border-black/20 dark:border-white/10
            bg-white/80 dark:bg-black/60 focus:outline-none focus:ring-2 focus:ring-black/20 dark:focus:ring-white/30 transition-colors duration-300"/>
        </div>

        <!-- Password -->
        <div class="mb-8 relative">
          <label for="password" class="block text-sm mb-2 text-slate-700 dark:text-slate-300 transition-colors duration-300">
            Password
          </label>
          <input type="password" id="password" name="password" placeholder="Enter your password" required
            class="w-full px-4 py-3 pr-12 rounded-xl border border-black/20 dark:border-white/10
            bg-white/80 dark:bg-black/60 focus:outline-none focus:ring-2 focus:ring-black/20 dark:focus:ring-white/30 transition-colors duration-300"/>
          <button type="button" id="togglePassword" class="absolute right-4 top-[42px] text-slate-500 dark:text-slate-400 hover:text-black dark:hover:text-white text-sm transition">Show</button>
        </div>

        <!-- Sign In Button -->
        <button type="submit"
          class="w-full py-3 rounded-xl font-semibold
          bg-gradient-to-r from-white via-slate-200 to-white dark:from-black dark:via-zinc-800 dark:to-black
          text-black dark:text-white hover:scale-[1.02] transition-all duration-300
          shadow-[0_10px_30px_rgba(0,0,0,0.1)] dark:shadow-[0_10px_30px_rgba(255,255,255,0.05)]">
          Sign In
        </button>

        <!-- Links -->
        <div class="text-center text-sm text-slate-600 dark:text-slate-400 mt-8 transition-colors duration-300">
          <a href="forgotpassword.html" class="hover:text-black dark:hover:text-white transition">Forgot Password?</a>
          <span class="mx-2">|</span>
          <a href="register.html" class="hover:text-black dark:hover:text-white transition">Create Account</a>
        </div>
      </form>
    </section>

    <!-- Footer -->
    <footer class="text-center text-slate-500 dark:text-slate-400 text-sm py-6 border-t border-black/10 dark:border-white/10 transition-colors duration-300">
      This product uses the TMDB API but is not endorsed or certified by TMDB.
    </footer>

    <!-- Navbar + Theme Toggle -->
    <script>
      const htmlEl = document.documentElement;
      const sunIcon = "/assets/images/sun-regular.png";
      const moonIcon = "/assets/images/moon-white.png";

      async function loadNavbar() {
        try {
          const res = await fetch("components/navbar.html");
          if (!res.ok) throw new Error("Navbar fetch failed");
          document.getElementById("navbar").innerHTML = await res.text();

          const toggleBtn = document.getElementById("themeToggle");
          const themeIcon = document.getElementById("themeIcon");
          if (!toggleBtn || !themeIcon) return;

          function setIcon() {
            themeIcon.src = htmlEl.classList.contains("dark") ? moonIcon : sunIcon;
          }
          setIcon();

          toggleBtn.addEventListener("click", () => {
            htmlEl.classList.toggle("dark");
            localStorage.setItem("theme", htmlEl.classList.contains("dark") ? "dark" : "light");
            setIcon();
          });
        } catch (err) {
          console.error("Navbar load error:", err);
        }
      }

      loadNavbar();
    </script>

    <!-- Login Handler -->
    <script>
      const loginForm = document.getElementById("loginForm");
      const emailInput = document.getElementById("email");
      const passwordInput = document.getElementById("password");
      const togglePasswordBtn = document.getElementById("togglePassword");

      togglePasswordBtn.addEventListener("click", () => {
        if (passwordInput.type === "password") {
          passwordInput.type = "text";
          togglePasswordBtn.textContent = "Hide";
        } else {
          passwordInput.type = "password";
          togglePasswordBtn.textContent = "Show";
        }
      });

      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = emailInput.value.trim();
        const password = passwordInput.value.trim();
        if (!email || !password) return alert("Please enter both email and password.");

        try {
          const res = await fetch("http://localhost:5000/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password })
          });

          const data = await res.json();
          if (!res.ok) throw new Error(data.message || "Login failed");

          // Store user info in localStorage (demo)
          localStorage.setItem("user", JSON.stringify({ email }));
          alert(data.message);
          window.location.href = "account.html";
        } catch (err) {
          alert(err.message);
        }
      });
    </script>
  </body>
</html>
