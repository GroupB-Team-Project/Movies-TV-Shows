<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ViewIT</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="./css/global.css" />
  </head>

  <body class="relative min-h-screen text-white bg-black overflow-x-hidden">
    <div id="navbar"></div>

    <!-- HERO -->
    <section class="relative h-[70vh] overflow-hidden">
      <div
        id="carouselTrack"
        class="flex h-full transition-transform duration-1000 ease-in-out"
      ></div>

      <!-- SIDE GRADIENT -->
      <div
        class="absolute inset-0 z-10 bg-[linear-gradient(to_right,rgba(0,0,0,0.95)_10%,rgba(0,0,0,0.7)_40%,rgba(0,0,0,0.3)_70%,transparent_100%)]"
      ></div>

      <!-- TOP/BOTTOM FADE -->
      <div
        class="absolute inset-0 z-10 bg-[linear-gradient(to_bottom,rgba(0,0,0,0.9)_0%,rgba(0,0,0,0)_30%,rgba(0,0,0,0)_70%,rgba(0,0,0,0.95)_100%)]"
      ></div>

      <!-- HERO TEXT -->
      <div class="absolute bottom-24 left-16 z-20 max-w-xl">
        <p class="text-sm text-white/70 mb-3 tracking-widest uppercase">
          ViewIT Original
        </p>

        <h2
          id="slideTitle"
          class="text-6xl font-bold mb-4 leading-tight drop-shadow-[0_6px_30px_rgba(0,0,0,0.8)]"
        ></h2>

        <div class="flex items-center gap-4 text-sm text-white/80 mb-4">
          <span id="slideYear"></span>
          <span id="slideRating"></span>
          <span id="slideScore"></span>
        </div>

        <p id="slideOverview" class="text-lg text-white/90 max-w-lg mb-6"></p>

        <div class="flex gap-4">
          <button
            id="playHero"
            class="flex items-center gap-2 bg-white text-black px-6 py-3 rounded-lg font-semibold hover:bg-gray-200 transition"
          >
            ▶ Play
          </button>

          <button
            id="infoHero"
            class="flex items-center gap-2 bg-white/20 backdrop-blur-md px-6 py-3 rounded-lg font-semibold hover:bg-white/30 transition"
          >
            More Info
          </button>
        </div>
      </div>

      <button
        id="prevBtn"
        class="absolute left-6 top-1/2 -translate-y-1/2 z-30 bg-black/40 backdrop-blur-md p-3 rounded-full hover:bg-black/70 transition"
      >
        ‹
      </button>

      <button
        id="nextBtn"
        class="absolute right-6 top-1/2 -translate-y-1/2 z-30 bg-black/40 backdrop-blur-md p-3 rounded-full hover:bg-black/70 transition"
      >
        ›
      </button>

      <div
        id="carouselDots"
        class="absolute bottom-6 left-1/2 -translate-x-1/2 flex gap-2 z-30"
      ></div>
    </section>

    <!-- TOGGLE -->
    <section class="py-14 text-center relative z-40">
      <div
        class="inline-flex p-1 rounded-2xl bg-white/5 backdrop-blur-xl border border-white/10 shadow-[0_10px_40px_rgba(0,0,0,0.6)]"
      >
        <button
          id="moviesTab"
          class="px-8 py-3 rounded-xl font-medium transition-all duration-300 hover:bg-white/10 hover:scale-105"
        >
          Movies
        </button>

        <button
          id="tvTab"
          class="px-8 py-3 rounded-xl font-medium transition-all duration-300 hover:bg-white/10 hover:scale-105"
        >
          TV Shows
        </button>
      </div>
    </section>

    <!-- GRID -->
    <section class="max-w-7xl mx-auto px-6 pb-24 relative z-40">
      <div
        id="content"
        class="grid sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-10"
      ></div>

      <div class="text-center mt-12">
        <button
          id="showMoreBtn"
          class="px-8 py-3 bg-white text-black rounded-xl font-semibold hover:scale-105 transition"
        >
          Load More
        </button>
      </div>
    </section>

    <script>
      fetch("./components/navbar.html")
        .then((res) => res.text())
        .then((html) => {
          document.getElementById("navbar").innerHTML = html;
        });
    </script>

    <!-- HERO SCRIPT -->
    <script type="module">
      import { TMDB_API_KEY, BASE_URL, YOUTUBE_BASE_URL } from "./js/config.js";

      const IMAGE_URL = "https://image.tmdb.org/t/p/original";

      const carouselTrack = document.getElementById("carouselTrack");
      const dotsContainer = document.getElementById("carouselDots");

      const slideTitle = document.getElementById("slideTitle");
      const slideOverview = document.getElementById("slideOverview");

      const slideYear = document.getElementById("slideYear");
      const slideRating = document.getElementById("slideRating");
      const slideScore = document.getElementById("slideScore");

      const playHero = document.getElementById("playHero");
      const infoHero = document.getElementById("infoHero");

      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");

      let currentSlide = 0;
      let slides = [];
      let interval;

      async function loadLatestMovies() {
        const res = await fetch(
          `${BASE_URL}/movie/now_playing?api_key=${TMDB_API_KEY}`,
        );
        const data = await res.json();

        slides = data.results.filter((m) => m.backdrop_path).slice(0, 6);

        if (!slides.length) return;

        carouselTrack.innerHTML = "";
        dotsContainer.innerHTML = "";

        slides.forEach((movie, index) => {
          const slide = document.createElement("div");
          slide.className = "min-w-full h-full relative";

          slide.innerHTML = `
<div class="absolute inset-0 bg-cover bg-center"
style="background-image:url(${IMAGE_URL + movie.backdrop_path})">
</div>
`;

          carouselTrack.appendChild(slide);

          const dot = document.createElement("button");
          dot.className =
            "w-2 h-2 rounded-full bg-white/30 transition-all duration-300";

          dot.addEventListener("click", () => goToSlide(index));
          dotsContainer.appendChild(dot);
        });

        updateSlideContent();
        updateDots();
        startCarousel();
      }

      function updateSlideContent() {
        if (!slides.length) return;

        const movie = slides[currentSlide];

        slideTitle.textContent = movie.title || "";

        slideOverview.textContent = movie.overview
          ? movie.overview.slice(0, 150) + "..."
          : "";

        slideYear.textContent = movie.release_date
          ? movie.release_date.slice(0, 4)
          : "";

        slideRating.textContent = movie.adult ? "PG-13" : "PG";

        slideScore.textContent =
          "⭐ " + (movie.vote_average?.toFixed(1) || "N/A");

        /* PLAY BUTTON */
        playHero.onclick = async () => {
          const res = await fetch(
            `${BASE_URL}/movie/${movie.id}/videos?api_key=${TMDB_API_KEY}`,
          );

          const data = await res.json();

          const trailer = data.results.find(
            (v) => v.type === "Trailer" && v.site === "YouTube",
          );

          if (trailer) {
            window.open(YOUTUBE_BASE_URL + trailer.key, "_blank");
          }
        };

        /* MORE INFO */
        infoHero.onclick = () => {
          window.location.href = `pages/details.html?id=${movie.id}&type=movie`;
        };
      }

      function goToSlide(index) {
        currentSlide = index;

        carouselTrack.style.transform = `translateX(-${currentSlide * 100}%)`;

        updateDots();
        updateSlideContent();
        resetInterval();
      }

      function updateDots() {
        [...dotsContainer.children].forEach((dot, index) => {
          dot.classList.remove("bg-white");
          dot.classList.add("bg-white/30");

          if (index === currentSlide) {
            dot.classList.remove("bg-white/30");
            dot.classList.add("bg-white");
          }
        });
      }

      function startCarousel() {
        interval = setInterval(() => {
          currentSlide = (currentSlide + 1) % slides.length;
          goToSlide(currentSlide);
        }, 5000);
      }

      function resetInterval() {
        clearInterval(interval);
        startCarousel();
      }

      prevBtn.addEventListener("click", () => {
        currentSlide = (currentSlide - 1 + slides.length) % slides.length;
        goToSlide(currentSlide);
      });

      nextBtn.addEventListener("click", () => {
        currentSlide = (currentSlide + 1) % slides.length;
        goToSlide(currentSlide);
      });

      loadLatestMovies();
    </script>

    <script src="../js/movieActions.js"></script>
    <script type="module" src="./js/main.js"></script>

    <!-- TRAILER MODAL -->
    <div
      id="trailerModal"
      class="fixed inset-0 bg-black/80 flex items-center justify-center z-50 hidden"
    >
      <div class="relative w-[90%] max-w-4xl">
        <button
          id="closeTrailer"
          class="absolute -top-10 right-0 text-white text-3xl"
        >
          ✕
        </button>

        <iframe
          id="trailerFrame"
          class="w-full aspect-video rounded-lg"
          src=""
          allow="autoplay; encrypted-media"
          allowfullscreen
        >
        </iframe>
      </div>
    </div>
  </body>
</html>
