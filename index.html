<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ViewIT</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>

  <body
    data-page="index"
    class="relative min-h-screen text-white overflow-x-hidden bg-black"
  >
    <!-- PREMIUM BACKGROUND -->
    <div class="fixed inset-0 -z-10 overflow-hidden">
      <!-- Base gradient -->
      <div
        class="absolute inset-0 bg-gradient-to-br from-black via-zinc-900 to-black"
      ></div>

      <!-- Large silver glow -->
      <div
        class="absolute -top-64 -left-64 w-[900px] h-[900px] bg-[radial-gradient(circle,rgba(255,255,255,0.08),transparent_70%)] blur-3xl"
      ></div>

      <div
        class="absolute -bottom-64 -right-64 w-[900px] h-[900px] bg-[radial-gradient(circle,rgba(255,255,255,0.06),transparent_70%)] blur-3xl"
      ></div>

      <!-- Center cinematic light -->
      <div
        class="absolute inset-0 bg-[radial-gradient(circle_at_center,rgba(255,255,255,0.04),transparent_70%)]"
      ></div>

      <!-- Subtle grain -->
      <div
        class="absolute inset-0 opacity-[0.03] bg-[url('data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2260%22 height=%2260%22%3E%3Cfilter id=%22n%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.9%22 numOctaves=%222%22/%3E%3C/filter%3E%3Crect width=%2260%22 height=%2260%22 filter=%22url(%23n)%22/%3E%3C/svg%3E')]"
      ></div>
    </div>

    <div id="navbar"></div>

    <section class="py-28 text-center">
      <h1 class="text-5xl font-bold mb-6 tracking-wide">
        Discover Movies & TV Shows
      </h1>

      <div class="flex justify-center gap-4">
        <button
          id="moviesTab"
          class="px-6 py-2 rounded-lg bg-slate-200 text-black font-semibold"
        >
          🎬 Movies
        </button>

        <button id="tvTab" class="px-6 py-2 rounded-lg bg-zinc-800 text-white">
          📺 TV Shows
        </button>
      </div>
    </section>

    <section class="max-w-7xl mx-auto px-6 pb-24">
      <div
        id="content"
        class="grid sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-10"
      ></div>
    </section>

    <footer
      class="border-t border-white/10 text-center text-slate-500 text-sm py-8"
    >
      This product uses the TMDB API but is not endorsed or certified by TMDB.
    </footer>

    <script>
      fetch("components/navbar.html")
        .then((res) => res.text())
        .then((html) => {
          document.getElementById("navbar").innerHTML = html;
        });
    </script>

    <div
      id="content"
      class="grid sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8 mb-10"
    ></div>

    <div class="text-center mb-20">
      <button
        id="showMoreBtn"
        class="px-6 py-3 rounded-lg bg-gradient-to-r from-white via-slate-200 to-white text-black font-semibold hover:scale-105 transition"
      >
        Load More
      </button>
    </div>

    <script type="module" src="/js/main.js"></script>
  </body>
</html>
