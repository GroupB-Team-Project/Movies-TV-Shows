<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feedback | ViewIT</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { darkMode: "class" };
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />

    <style>
      body { font-family: 'Ubuntu', sans-serif; }
    </style>

    <!-- Apply saved theme immediately -->
    <script>
      const html = document.documentElement;
      const savedTheme = localStorage.getItem("theme");
      if (savedTheme === "dark") html.classList.add("dark");
      else if (savedTheme === "light") html.classList.remove("dark");
      else if (window.matchMedia("(prefers-color-scheme: dark)").matches)
        html.classList.add("dark");
    </script>
  </head>

  <body class="relative min-h-screen overflow-x-hidden transition-colors duration-300 bg-white dark:bg-black text-slate-900 dark:text-white">
    <!-- Background -->
    <div class="fixed inset-0 -z-10 overflow-hidden">
      <!-- Light/Dark gradient -->
      <div class="absolute inset-0 bg-gradient-to-br from-white/5 via-zinc-100 to-white/10 dark:from-black dark:via-zinc-900 dark:to-black"></div>

      <div class="absolute -top-64 -left-64 w-[800px] h-[800px] bg-[radial-gradient(circle,rgba(0,0,0,0.02),transparent_70%)] dark:bg-[radial-gradient(circle,rgba(255,255,255,0.06),transparent_70%)] blur-3xl"></div>
      <div class="absolute -bottom-64 -right-64 w-[800px] h-[800px] bg-[radial-gradient(circle,rgba(0,0,0,0.02),transparent_70%)] dark:bg-[radial-gradient(circle,rgba(255,255,255,0.05),transparent_70%)] blur-3xl"></div>
    </div>

    <!-- Navbar -->
    <div id="navbar"></div>

    <!-- Header -->
    <section class="py-24 text-center">
      <h1 class="text-5xl font-bold mb-4 transition-colors duration-300">We Value Your Feedback</h1>
      <p class="text-slate-600 dark:text-slate-400 max-w-xl mx-auto transition-colors duration-300">
        Help us improve ViewIT by sharing your thoughts, suggestions, or reporting any issues.
      </p>
    </section>

    <!-- Feedback Form -->
    <section class="max-w-3xl mx-auto px-6 pb-24">
      <form id="feedbackForm" class="p-10 rounded-3xl transition-colors duration-300
        bg-white/70 dark:bg-black/70 backdrop-blur-2xl border border-black/10 dark:border-white/10
        shadow-[0_5px_20px_rgba(0,0,0,0.1)] dark:shadow-[0_10px_30px_rgba(255,255,255,0.05)]">
        
        <div class="mb-6">
          <label class="block text-sm mb-2 text-slate-700 dark:text-slate-300 transition-colors duration-300">Your Name</label>
          <input type="text" id="name" required
            class="w-full px-4 py-3 rounded-xl border border-black/20 dark:border-white/10
            bg-white/80 dark:bg-black/60 focus:outline-none focus:ring-2 focus:ring-black/20 dark:focus:ring-white/30 transition-colors duration-300"/>
        </div>

        <div class="mb-6">
          <label class="block text-sm mb-2 text-slate-700 dark:text-slate-300 transition-colors duration-300">Email Address</label>
          <input type="email" id="email" required
            class="w-full px-4 py-3 rounded-xl border border-black/20 dark:border-white/10
            bg-white/80 dark:bg-black/60 focus:outline-none focus:ring-2 focus:ring-black/20 dark:focus:ring-white/30 transition-colors duration-300"/>
        </div>

        <div class="mb-6">
          <label class="block text-sm mb-2 text-slate-700 dark:text-slate-300 transition-colors duration-300">Category</label>
          <select id="category"
            class="w-full px-4 py-3 rounded-xl border border-black/20 dark:border-white/10
            bg-white/80 dark:bg-black/60 focus:outline-none focus:ring-2 focus:ring-black/20 dark:focus:ring-white/30 transition-colors duration-300">
            <option>General Feedback</option>
            <option>Bug Report</option>
            <option>Feature Request</option>
            <option>Other</option>
          </select>
        </div>

        <div class="mb-8">
          <label class="block text-sm mb-2 text-slate-700 dark:text-slate-300 transition-colors duration-300">Your Message</label>
          <textarea id="message" rows="5" required
            class="w-full px-4 py-3 rounded-xl border border-black/20 dark:border-white/10
            bg-white/80 dark:bg-black/60 focus:outline-none focus:ring-2 focus:ring-black/20 dark:focus:ring-white/30 transition-colors duration-300 resize-none"></textarea>
        </div>

        <button type="submit"
          class="w-full py-3 rounded-xl font-semibold
          bg-gradient-to-r from-white via-slate-200 to-white dark:from-black dark:via-zinc-800 dark:to-black
          text-black dark:text-white hover:scale-[1.02] transition-all duration-300
          shadow-[0_10px_30px_rgba(0,0,0,0.1)] dark:shadow-[0_10px_30px_rgba(255,255,255,0.05)]">
          Submit Feedback
        </button>
      </form>
    </section>

    <!-- Footer -->
    <footer class="text-center text-slate-500 dark:text-slate-400 text-sm py-6 border-t border-black/10 dark:border-white/10 transition-colors duration-300">
      This product uses the TMDB API but is not endorsed or certified by TMDB.
    </footer>

    <!-- Navbar + Theme Toggle -->
    <script>
      const htmlEl = document.documentElement;
      const sunIcon = "/assets/images/sun-regular.png";
      const moonIcon = "/assets/images/moon-white.png";

      async function loadNavbar() {
        try {
          const res = await fetch("components/navbar.html");
          if (!res.ok) throw new Error("Navbar fetch failed");
          document.getElementById("navbar").innerHTML = await res.text();

          const toggleBtn = document.getElementById("themeToggle");
          const themeIcon = document.getElementById("themeIcon");
          if (!toggleBtn || !themeIcon) return;

          function setIcon() {
            themeIcon.src = htmlEl.classList.contains("dark") ? moonIcon : sunIcon;
          }
          setIcon();

          toggleBtn.addEventListener("click", () => {
            htmlEl.classList.toggle("dark");
            localStorage.setItem("theme", htmlEl.classList.contains("dark") ? "dark" : "light");
            setIcon();
          });
        } catch (err) {
          console.error("Navbar load error:", err);
        }
      }

      loadNavbar();
    </script>

    <!-- Feedback Form Handler -->
    <script>
      document.getElementById("feedbackForm").addEventListener("submit", function(e){
        e.preventDefault();
        alert("Thank you for your feedback!");
        this.reset();
      });
    </script>
  </body>
</html>
