<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | ViewIT</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { darkMode: "class" };
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />

    <style>
      body { font-family: 'Ubuntu', sans-serif; }
    </style>

    <!-- Apply saved theme immediately -->
    <script>
      const htmlEl = document.documentElement;

      const savedTheme = localStorage.getItem("theme");
      if (savedTheme === "dark") htmlEl.classList.add("dark");
      else if (savedTheme === "light") htmlEl.classList.remove("dark");
      else if (window.matchMedia("(prefers-color-scheme: dark)").matches)
        htmlEl.classList.add("dark");
    </script>
  </head>

  <body class="relative min-h-screen overflow-hidden transition-colors duration-300 bg-white dark:bg-black text-slate-900 dark:text-white">

    <!-- Background -->
    <div class="fixed inset-0 -z-10 overflow-hidden">
      <div class="absolute inset-0 bg-gradient-to-br from-white/5 via-zinc-100 to-white/10 dark:from-black dark:via-zinc-900 dark:to-black"></div>
      <div class="absolute -top-64 -left-64 w-[800px] h-[800px] bg-[radial-gradient(circle,rgba(0,0,0,0.02),transparent_70%)] dark:bg-[radial-gradient(circle,rgba(255,255,255,0.06),transparent_70%)] blur-3xl"></div>
      <div class="absolute -bottom-64 -right-64 w-[800px] h-[800px] bg-[radial-gradient(circle,rgba(0,0,0,0.02),transparent_70%)] dark:bg-[radial-gradient(circle,rgba(255,255,255,0.05),transparent_70%)] blur-3xl"></div>
      <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,rgba(0,0,0,0.01),transparent_70%)] dark:bg-[radial-gradient(circle_at_center,rgba(255,255,255,0.05),transparent_70%)]"></div>
    </div>

    <!-- Navbar -->
    <div id="navbar"></div>

    <!-- Login Section -->
    <section class="flex items-center justify-center min-h-[calc(100vh-4rem)] px-6">
      <form id="loginForm" novalidate
        class="relative w-full max-w-md p-10 rounded-3xl transition-colors duration-300
        bg-white/70 dark:bg-black/70 backdrop-blur-2xl border border-black/10 dark:border-white/10
        shadow-[0_5px_20px_rgba(0,0,0,0.1)] dark:shadow-[0_10px_30px_rgba(255,255,255,0.05)]">

        <h1 class="text-4xl font-bold text-center mb-2">Welcome Back</h1>
        <p class="text-slate-600 dark:text-slate-400 text-center mb-8">
          Sign in to continue to ViewIT
        </p>

        <!-- Email -->
        <div class="mb-6">
          <label class="block text-sm mb-2">Email Address</label>
          <input type="email" id="email" required
            class="w-full px-4 py-3 rounded-xl border bg-white/80 dark:bg-black/60"/>
        </div>

        <!-- Password -->
        <div class="mb-8 relative">
          <label class="block text-sm mb-2">Password</label>
          <input type="password" id="password" required
            class="w-full px-4 py-3 pr-12 rounded-xl border bg-white/80 dark:bg-black/60"/>

          <button type="button" id="togglePassword"
            class="absolute right-4 top-[42px] text-sm">
            Show
          </button>
        </div>

        <!-- Submit -->
        <button type="submit"
          class="w-full py-3 rounded-xl font-semibold bg-black text-white dark:bg-white dark:text-black">
          Sign In
        </button>

        <!-- Forgot Password -->
        <div class="text-center mt-4">
          <a href="/forgotPassword.html"
            class="text-sm text-slate-500 dark:text-slate-400 hover:text-black dark:hover:text-white transition-colors duration-200">
            Forgot Password?
          </a>
        </div>

        <!-- Create Account -->
        <div class="text-center mt-3">
          <span class="text-sm text-slate-500 dark:text-slate-400">Don't have an account? </span>
          <a href="/register.html"
            class="text-sm font-semibold text-black dark:text-white hover:underline transition-colors duration-200">
            Create an Account
          </a>
        </div>

      </form>
    </section>

    <!-- Navbar loader -->
    <script type="module">
      const htmlEl = document.documentElement;
      const sunIcon = "/assets/sun-regular.png";
      const moonIcon = "/assets/moon-white.png";

      async function loadNavbar() {
        try {
          const res = await fetch("/components/navbar.html");
          if (!res.ok) throw new Error("Navbar fetch failed");
          document.getElementById("navbar").innerHTML = await res.text();

          const toggleBtn = document.getElementById("themeToggle");
          const themeIcon = document.getElementById("themeIcon");

          if (toggleBtn && themeIcon) {
            function setIcon() {
              themeIcon.src = htmlEl.classList.contains("dark") ? moonIcon : sunIcon;
            }
            setIcon();
            toggleBtn.addEventListener("click", () => {
              htmlEl.classList.toggle("dark");
              localStorage.setItem("theme", htmlEl.classList.contains("dark") ? "dark" : "light");
              setIcon();
            });
          }
        } catch (err) {
          console.error("Navbar load error:", err);
        }
      }

      loadNavbar();
    </script>

    <!-- Password toggle -->
    <script>
      const togglePasswordBtn = document.getElementById("togglePassword");
      const passwordInput = document.getElementById("password");

      togglePasswordBtn.addEventListener("click", () => {
        passwordInput.type =
          passwordInput.type === "password" ? "text" : "password";
        togglePasswordBtn.textContent =
          passwordInput.type === "password" ? "Show" : "Hide";
      });
    </script>

    <!-- Login handler -->
    <script>
      // ✅ Dynamically use current origin so it works both locally and on Railway
      const API_BASE = window.location.origin;

      const loginForm = document.getElementById("loginForm");
      const emailInput = document.getElementById("email");

      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();

        const email = emailInput.value.trim();
        const password = passwordInput.value.trim();

        if (!email || !password) {
          alert("Please enter both email and password.");
          return;
        }

        try {
          const res = await fetch(`${API_BASE}/api/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password })
          });

          const data = await res.json();

          if (!res.ok) throw new Error(data.message || "Login failed");

          // ✅ Store using the keys auth.js expects
          localStorage.setItem("userEmail", email);
          localStorage.setItem("loggedIn", "true");

          alert(data.message);

          window.location.href = "/index.html";

        } catch (err) {
          alert(err.message);
        }
      });
    </script>

  </body>
</html>
