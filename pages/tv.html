<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>TV Shows | ViewIT</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/css/global.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { darkMode: "class" };
    </script>
  </head>

  <body
    data-page="tv"
    class="relative min-h-screen overflow-x-hidden transition-colors duration-300 bg-white dark:bg-black text-slate-900 dark:text-white"
  >
    <!-- BACKGROUND GRADIENT + RADIAL HIGHLIGHTS -->
    <div class="fixed inset-0 -z-10 overflow-hidden">
      <div class="absolute inset-0 bg-gradient-to-br from-white/10 dark:from-black via-white/5 dark:via-zinc-900 to-white/5 dark:to-black transition-colors duration-300"></div>
      <div class="absolute -top-64 -left-64 w-[800px] h-[800px] bg-[radial-gradient(circle,rgba(0,0,0,0.05),transparent_70%)] dark:bg-[radial-gradient(circle,rgba(255,255,255,0.03),transparent_70%)] blur-3xl transition-colors duration-300"></div>
      <div class="absolute -bottom-64 -right-64 w-[800px] h-[800px] bg-[radial-gradient(circle,rgba(0,0,0,0.04),transparent_70%)] dark:bg-[radial-gradient(circle,rgba(255,255,255,0.02),transparent_70%)] blur-3xl transition-colors duration-300"></div>
    </div>

    <div id="navbar"></div>

    <!-- HEADER -->
    <section class="py-28 text-center">
      <h1 class="text-5xl font-bold mb-4 transition-colors duration-300">On Air TV Shows</h1>
      <p class="text-slate-700 dark:text-slate-400 transition-colors duration-300">Currently airing series</p>
    </section>

    <!-- TV GRID -->
    <section class="max-w-7xl mx-auto px-6 pb-24">
      <div id="content" class="grid sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-10"></div>
    </section>

    <!-- FOOTER -->
    <footer class="border-t border-black/10 dark:border-white/10 text-center text-slate-500 dark:text-slate-400 text-sm py-8 transition-colors duration-300">
      This product uses the TMDB API but is not endorsed or certified by TMDB.
    </footer>

    <!-- NAVBAR + THEME TOGGLE -->
    <script>
      const htmlEl = document.documentElement;
      const sunIcon = "/assets/images/sun-regular.png";
      const moonIcon = "/assets/images/moon-white.png";

      async function loadNavbar() {
        try {
          const res = await fetch("../components/navbar.html");
          if (!res.ok) throw new Error("Navbar fetch failed");
          document.getElementById("navbar").innerHTML = await res.text();

          const toggleBtn = document.getElementById("themeToggle");
          const themeIcon = document.getElementById("themeIcon");
          if (!toggleBtn || !themeIcon) return;

          function setIcon() {
            themeIcon.src = htmlEl.classList.contains("dark") ? moonIcon : sunIcon;
          }
          setIcon();

          toggleBtn.addEventListener("click", () => {
            htmlEl.classList.toggle("dark");
            localStorage.setItem("theme", htmlEl.classList.contains("dark") ? "dark" : "light");
            setIcon();
          });
        } catch (err) {
          console.error("Navbar load error:", err);
        }
      }

      // Apply saved theme
      const savedTheme = localStorage.getItem("theme");
      if (savedTheme === "dark") htmlEl.classList.add("dark");
      else if (savedTheme === "light") htmlEl.classList.remove("dark");
      else if (window.matchMedia("(prefers-color-scheme: dark)").matches)
        htmlEl.classList.add("dark");

      loadNavbar();
    </script>
    <script src="../js/movieActions.js"></script>

    <!-- Original main.js -->
    <script type="module" src="../js/main.js"></script>
  </body>
</html>
