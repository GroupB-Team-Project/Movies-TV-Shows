<header class="bg-white/80 dark:bg-black/80 backdrop-blur-xl border-b border-black/10 dark:border-white/10 sticky top-0 z-50 transition-colors duration-300">
  <nav class="max-w-7xl mx-auto px-6">
    <div class="flex items-center justify-between h-16">
      <!-- Logo -->
      <a href="/index.html" class="flex items-center gap-2">
        <img class="w-28 h-auto" src="../../assets/viewit-logo.png" alt="ViewIT logo" />
      </a>

      <!-- Nav Links -->
      <ul class="hidden md:flex items-center gap-8 text-slate-700 dark:text-slate-300 font-medium">
        <li><a href="/index.html" class="hover:text-black dark:hover:text-white transition">Home</a></li>
        <li><a href="/film.html" class="hover:text-black dark:hover:text-white transition">Films</a></li>
        <li><a href="/tv.html" class="hover:text-black dark:hover:text-white transition">TV</a></li>
        <li><a href="/reviews.html" class="hover:text-black dark:hover:text-white transition">Highest Rated</a></li>
        <li><a href="/feedback.html" class="hover:text-black dark:hover:text-white transition">Feedback</a></li>
        <li><a href="/about.html" class="hover:text-black dark:hover:text-white transition">About</a></li>
      </ul>

      <!-- Theme toggle + Account -->
      <div class="flex items-center gap-3">
        <button
          id="themeToggle"
          class="p-2 rounded-lg border border-black/20 dark:border-white/20 hover:bg-black/10 dark:hover:bg-white/10 transition"
        >
          <img
            id="themeIcon"
            alt="theme icon"
            class="w-5 h-5"
          />
        </button>

        
          <id="accountLink"
          href="/login.html"
          class="px-4 py-2 rounded-lg bg-black text-white dark:bg-white dark:text-black font-semibold hover:scale-[1.05] transition-all duration-300"
        >
          Login
        </a>
      </div>
    </div>
  </nav>
</header>

<script type="module">
  import { isLoggedIn } from "../../js/auth.js";

  const accountLink = document.getElementById("accountLink");

  if (isLoggedIn()) {
    accountLink.textContent = "Account";
    accountLink.href = "/pages/account.html";
  } else {
    accountLink.textContent = "Login";
    accountLink.href = "/pages/login.html";
  }
</script>

<script>
  const toggleBtn = document.getElementById("themeToggle");
  const themeIcon = document.getElementById("themeIcon");
  const html = document.documentElement;

  const sunIcon = "/assets/sun-regular.png";
  const moonIcon = "/assets/moon-white.png";

  // Apply saved theme
  const savedTheme = localStorage.getItem("theme");
  if (savedTheme === "dark") html.classList.add("dark");
  else if (savedTheme === "light") html.classList.remove("dark");

  function setIcon() {
    themeIcon.src = html.classList.contains("dark") ? moonIcon : sunIcon;
  }
  setIcon();

  toggleBtn.addEventListener("click", () => {
    html.classList.toggle("dark");
    localStorage.setItem("theme", html.classList.contains("dark") ? "dark" : "light");
    setIcon();
  });
</script>
