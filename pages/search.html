<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Search | ViewIT</title>

    <!-- Global CSS -->
    <link rel="stylesheet" href="/css/global.css" />

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="bg-black text-white">
    <div class="flex h-screen">
      <!-- LEFT SIDE -->
      <div class="w-1/3 bg-neutral-900 p-6 border-r border-white/10">
        <input
          id="searchInput"
          type="text"
          placeholder="Titles, people, genres"
          class="w-full p-3 text-lg bg-black border border-white/20 outline-none focus:border-white"
        />
        <ul id="suggestions" class="mt-4 space-y-2 text-sm text-gray-300"></ul>

        <p class="text-sm text-gray-400 mt-4">
          Start typing to search movies & TV shows
        </p>
      </div>

      <!-- RIGHT SIDE -->
      <div class="w-2/3 p-6 overflow-y-auto">
        <h2 class="text-xl mb-4 font-semibold">Popular Searches</h2>

        <div id="results" class="grid grid-cols-4 gap-4"></div>

        <!-- Empty state -->
        <p id="noResults" class="hidden text-gray-400 mt-6">
          No results found.
        </p>
      </div>
    </div>

    <!-- JS -->
    <script type="module" src="/js/search.js"></script>
  </body>
</html>
