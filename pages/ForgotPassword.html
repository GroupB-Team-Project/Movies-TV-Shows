<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password | ViewIT</title>

    <link rel="stylesheet" href="/css/global.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body
    data-page="forgot-password"
    class="relative font-[Ubuntu] min-h-screen overflow-hidden transition-colors duration-300"
  >
    <!-- THEME BACKGROUND -->
    <div class="fixed inset-0 -z-10 overflow-hidden">
      <div
        class="absolute inset-0 bg-gradient-to-br dark:from-black dark:via-zinc-900 dark:to-black from-white/90 via-slate-100/70 to-white/95 transition-colors duration-300"
      ></div>
      <div
        class="absolute -top-64 -left-64 w-[800px] h-[800px] bg-[radial-gradient(circle,rgba(255,255,255,0.08),transparent_70%)] dark:bg-[radial-gradient(circle,rgba(0,0,0,0.08),transparent_70%)] blur-3xl transition-colors duration-300"
      ></div>
      <div
        class="absolute -bottom-64 -right-64 w-[800px] h-[800px] bg-[radial-gradient(circle,rgba(255,255,255,0.06),transparent_70%)] dark:bg-[radial-gradient(circle,rgba(0,0,0,0.06),transparent_70%)] blur-3xl transition-colors duration-300"
      ></div>
      <div
        class="absolute inset-0 bg-[radial-gradient(circle_at_center,rgba(255,255,255,0.05),transparent_70%)] dark:bg-[radial-gradient(circle_at_center,rgba(0,0,0,0.05),transparent_70%)] transition-colors duration-300"
      ></div>
    </div>

    <!-- NAVBAR -->
    <div id="navbar"></div>

    <!-- PAGE -->
    <section class="flex items-center justify-center min-h-[calc(100vh-4rem)] px-6">
      <form
        id="resetForm"
        class="relative w-full max-w-md p-10 rounded-3xl bg-white/5 dark:bg-black/30 backdrop-blur-2xl border border-white/10 dark:border-black/20 shadow-[0_0_60px_rgba(255,255,255,0.05)] dark:shadow-[0_0_60px_rgba(0,0,0,0.2)] transition-colors duration-300"
      >
        <div
          class="absolute inset-0 rounded-3xl border border-white/5 dark:border-black/20 pointer-events-none"
        ></div>

        <h1 class="text-4xl font-bold text-center mb-2 tracking-wide">
          Forgot Password
        </h1>
        <p class="text-slate-400 dark:text-slate-300 text-center mb-8">
          Step 1: Enter your email
        </p>

        <!-- Step 1: EMAIL -->
        <div id="emailInput">
          <label class="block text-sm mb-2 text-slate-300 dark:text-slate-200">
            Email Address
          </label>
          <input
            type="email"
            id="email"
            required
            placeholder="Enter Your Email"
            class="w-full px-4 py-3 mb-4 rounded-xl border focus:outline-none focus:ring-2 transition-colors duration-300"
          />
          <button
            type="button"
            id="nextBtn"
            class="mt-2 w-full py-3 rounded-xl font-semibold bg-gradient-to-r from-white via-slate-200 to-white dark:from-slate-800 dark:via-slate-700 dark:to-slate-800 text-black dark:text-white hover:scale-[1.02] transition-all duration-300 shadow-[0_10px_30px_rgba(255,255,255,0.15)] dark:shadow-[0_10px_30px_rgba(0,0,0,0.3)]"
          >
            Next
          </button>
        </div>

        <!-- Step 2: Reset Password -->
        <div id="passwordInput" class="hidden">
          <p class="text-slate-400 dark:text-slate-300 text-center mb-6">
            Step 2: Enter your new password
          </p>

          <label class="block text-sm mb-2 text-slate-300 dark:text-slate-200">
            New Password
          </label>
          <input
            type="password"
            id="newPassword"
            placeholder="Enter Your New Password"
            class="w-full px-4 py-3 mb-4 rounded-xl border focus:outline-none focus:ring-2 transition-colors duration-300"
          />

          <label class="block text-sm mb-2 text-slate-300 dark:text-slate-200">
            Confirm Password
          </label>
          <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm Your Password"
            class="w-full px-4 py-3 mb-4 rounded-xl border focus:outline-none focus:ring-2 transition-colors duration-300"
          />

          <p id="passwordmatch" class="text-xs text-red-400 mb-4"></p>

          <button
            type="submit"
            id="resetBtn"
            class="w-full py-3 rounded-xl font-semibold bg-gradient-to-r from-white via-slate-200 to-white dark:from-slate-800 dark:via-slate-700 dark:to-slate-800 text-black dark:text-white opacity-40 cursor-not-allowed transition-all duration-300 shadow-[0_10px_30px_rgba(255,255,255,0.15)] dark:shadow-[0_10px_30px_rgba(0,0,0,0.3)]"
            disabled
          >
            Reset Password
          </button>
        </div>

        <div class="text-center text-sm text-slate-400 dark:text-slate-300 mt-8">
          <a href="login.html" class="hover:text-white dark:hover:text-white transition">Back to Login Page</a>
        </div>
      </form>
    </section>

    <footer class="text-center text-slate-500 dark:text-slate-400 text-sm py-6 border-t border-white/5 dark:border-black/20 transition-colors duration-300">
      This product uses the TMDB API but is not endorsed or certified by TMDB.
    </footer>

    <script>
      const htmlEl = document.documentElement;
      const sunIcon = "/assets/images/sun-regular.png";
      const moonIcon = "/assets/images/moon-white.png";

      async function loadNavbar() {
        try {
          const res = await fetch("components/navbar.html");
          if (!res.ok) throw new Error("Navbar fetch failed");
          document.getElementById("navbar").innerHTML = await res.text();

          const toggleBtn = document.getElementById("themeToggle");
          const themeIcon = document.getElementById("themeIcon");
          if (!toggleBtn || !themeIcon) return;

          if (localStorage.getItem("theme") === "dark") htmlEl.classList.add("dark");

          function setIcon() {
            themeIcon.src = htmlEl.classList.contains("dark") ? moonIcon : sunIcon;
          }
          setIcon();

          toggleBtn.addEventListener("click", () => {
            htmlEl.classList.toggle("dark");
            localStorage.setItem("theme", htmlEl.classList.contains("dark") ? "dark" : "light");
            setIcon();
            updateInputColors();
          });
        } catch (err) {
          console.error("Navbar load error:", err);
        }
      }

      loadNavbar();

      const inputs = document.querySelectorAll("input");
      function updateInputColors() {
        inputs.forEach(input => {
          if (htmlEl.classList.contains("dark")) {
            input.style.backgroundColor = "rgba(255,255,255,0.1)";
            input.style.color = "#fff";
            input.style.borderColor = "rgba(255,255,255,0.2)";
          } else {
            input.style.backgroundColor = "#fff";
            input.style.color = "#000";
            input.style.borderColor = "#ccc";
          }
        });
      }

      // Initialize input colors
      updateInputColors();

      // Forgot Password logic
      const emailInputDiv = document.getElementById("emailInput");
      const passwordInputDiv = document.getElementById("passwordInput");
      const nextBtn = document.getElementById("nextBtn");
      const resetBtn = document.getElementById("resetBtn");
      const newPassword = document.getElementById("newPassword");
      const confirmPassword = document.getElementById("confirmPassword");
      const passwordMatchText = document.getElementById("passwordmatch");

      nextBtn.addEventListener("click", () => {
        const email = document.getElementById("email").value.trim();
        if (!email) { alert("Please enter your email."); return; }
        emailInputDiv.classList.add("hidden");
        passwordInputDiv.classList.remove("hidden");
      });

      function validatePasswords() {
        const pass = newPassword.value.trim();
        const confirm = confirmPassword.value.trim();

        if (!pass || !confirm) {
          resetBtn.disabled = true;
          resetBtn.classList.add("opacity-40", "cursor-not-allowed");
          passwordMatchText.textContent = "";
          return;
        }

        if (pass !== confirm) {
          passwordMatchText.textContent = "Passwords do not match!";
          passwordMatchText.className = "text-xs text-red-400 mb-4";
          resetBtn.disabled = true;
          resetBtn.classList.add("opacity-40", "cursor-not-allowed");
        } else {
          passwordMatchText.textContent = "Passwords match!";
          passwordMatchText.className = "text-xs text-green-400 mb-4";
          resetBtn.disabled = false;
          resetBtn.classList.remove("opacity-40", "cursor-not-allowed");
        }
      }

      newPassword.addEventListener("input", validatePasswords);
      confirmPassword.addEventListener("input", validatePasswords);

      document.getElementById("resetForm").addEventListener("submit", e => {
        e.preventDefault();
        alert("Password reset successful! (demo)");
        window.location.href = "login.html";
      });
    </script>
  </body>
</html>
