<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>TV Shows | ViewIT</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>

  <body
    data-page="tv"
    class="bg-gradient-to-br from-black via-zinc-900 to-black text-white min-h-screen"
  >
    <div id="navbar"></div>

    <section class="py-28 text-center">
      <h1 class="text-5xl font-bold mb-4">On Air TV Shows</h1>
      <p class="text-slate-400">Currently airing series</p>
    </section>

    <section class="max-w-7xl mx-auto px-6 pb-24">
      <div
        id="content"
        class="grid sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-10"
      ></div>
    </section>

    <footer
      class="border-t border-white/10 text-center text-slate-500 text-sm py-8"
    >
      This product uses the TMDB API but is not endorsed or certified by TMDB.
    </footer>

    <script>
      fetch("../components/navbar.html")
        .then((res) => res.text())
        .then((html) => {
          document.getElementById("navbar").innerHTML = html;
        });
    </script>

    <script type="module" src="../js/main.js"></script>
  </body>
</html>
