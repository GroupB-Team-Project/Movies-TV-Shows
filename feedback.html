<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Feedback | ViewIT</title>

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/theme.css" />
  </head>
  <body class="dark">
    <!-- NAVBAR -->
    <header class="navbar">
      <a href="index.html" class="brand">
        <span class="brand-icon">▶</span>
        <span class="brand-text">ViewIT</span>
      </a>

      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="film.html">Movies</a>
        <a href="tv.html">TV Shows</a>
        <a href="reviews.html">Top TMDB</a>
        <a href="feedback.html">Feedback</a>
        <a href="about.html">About</a>
        <button id="theme-toggle" class="theme-toggle">☀️ Light Mode</button>
      </nav>
    </header>

    <!-- HERO -->
    <section class="hero-ui">
      <div class="hero-content">
        <h1>Feedback</h1>
        <p>Tell us what you think about ViewIT.</p>
      </div>
    </section>

    <!-- FEEDBACK FORM -->
    <section class="section feedback-section">
      <form class="feedback-form" id="feedbackForm">
        <label>
          Your Name
          <input type="text" placeholder="Enter your name" />
        </label>

        <label>
          Email Address
          <input type="email" placeholder="Enter your email" />
        </label>

        <label>
          Your Feedback
          <textarea
            rows="5"
            placeholder="Write your feedback here..."
          ></textarea>
        </label>

        <button type="submit">Submit Feedback</button>
      </form>
    </section>

    <footer>
      <p>
        This product uses the TMDB API but is not endorsed or certified by TMDB.
      </p>
    </footer>

    <script src="js/app.js"></script>
    <script>
      const feedbackForm = document.getElementById("feedbackForm");

      if (feedbackForm) {
        feedbackForm.addEventListener("submit", function (e) {
          e.preventDefault(); // stopping the page from reloading

          alert("Thank you for your feedback! We appreciate it.");

          feedbackForm.reset(); // the form resets for new info to be added

          // Don't change the location of this - Aaron
          window.location.href = "index.html";
        });
      }
    </script>
  </body>
</html>
