<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ViewIT</title>

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/theme.css" />
  </head>
  <body class="dark">
    <!-- NAVBAR -->
    <header class="navbar">
      <a href="index.html" class="brand">
        <span class="brand-icon">▶</span>
        <span class="brand-text">ViewIT</span>
      </a>

      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="film.html">Movies</a>
        <a href="tv.html">TV Shows</a>
        <a href="reviews.html">Top TMDB</a>
        <a href="feedback.html">Feedback</a>
        <a href="about.html">About</a>
        <a href="login.html">Login</a>
        <button id="theme-toggle" class="theme-toggle">☀️ Light Mode</button>
      </nav>
    </header>

    <!-- HERO -->
    <section class="hero-ui">
      <div class="hero-content">
        <h1>Discover Movies & TV Shows</h1>

        <div class="search-box">
          <input type="text" placeholder="Enter keywords..." />
          <button>🔍</button>
        </div>
      </div>
    </section>

    <!-- CONTENT -->
    <section class="section">
      <div class="tabs">
        <button id="moviesTab" class="active">🎬 Movies</button>
        <button id="tvTab">📺 TV Shows</button>
      </div>

      <div id="content" class="cards-grid"></div>
    </section>

    <!-- MODAL -->
    <div id="detailsModal" class="modal hidden">
      <div class="modal-content">
        <span id="closeModal" class="close-btn">&times;</span>

        <div class="modal-body">
          <img id="modalPoster" />
          <div class="modal-info">
            <h2 id="modalTitle"></h2>
            <p id="modalOverview"></p>
            <p><strong>Rating:</strong> <span id="modalRating"></span></p>
            <p><strong>Release:</strong> <span id="modalDate"></span></p>
          </div>
        </div>
      </div>
    </div>

    <footer>
      <p>
        This product uses the TMDB API but is not endorsed or certified by TMDB.
      </p>

      <button id="theme-toggle">☀️ Light Mode</button>
    </footer>

    <script src="js/app.js"></script>
  </body>
</html>
